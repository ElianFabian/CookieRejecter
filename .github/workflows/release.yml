name: Release APK

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release, such as 0.0.2
        required: true
        type: string

jobs:
  release:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      BUILD_TOOLS_VERSION: '34.0.0'
    steps:
      - name: Check release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Use a numeric version tag such as 0.0.2."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Ensure Android SDK components are available
        run: |
          if [[ -f "$ANDROID_HOME/platforms/android-34/android.jar" &&
                -x "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" ]]; then
            exit 0
          fi
          for sdkmanager in "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager; do
            if [[ -x "$sdkmanager" ]]; then
              "$sdkmanager" --install 'platforms;android-34' "build-tools;$BUILD_TOOLS_VERSION"
              exit
            fi
          done
          echo "::error::Android SDK components and sdkmanager are missing from the runner."
          exit 1

      - name: Build release APK
        run: ./gradlew "-Dorg.gradle.java.home=$JAVA_HOME" --no-daemon lintRelease assembleRelease

      - name: Check APK version
        run: |
          tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          version="$("$tools/aapt" dump badging "$apk" | sed -n "s/^package: .*versionName='\([^']*\)'.*/\1/p")"
          if [[ "$version" != "$RELEASE_TAG" ]]; then
            echo "::error::The APK version ($version) must match the tag ($RELEASE_TAG)."
            exit 1
          fi

      - name: Sign and verify APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done

          tmp_dir="$(mktemp -d "$RUNNER_TEMP/cookierejecter-signing.XXXXXX")"
          trap 'rm -f -- "$tmp_dir/release.keystore" "$tmp_dir/aligned.apk"; rmdir -- "$tmp_dir"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$tmp_dir/release.keystore"
          tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          "$tools/zipalign" -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$tmp_dir/aligned.apk"
          "$tools/apksigner" sign --ks "$tmp_dir/release.keystore" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD --v4-signing-enabled false \
            --out "CookieRejecter-$RELEASE_TAG.apk" "$tmp_dir/aligned.apk"
          "$tools/apksigner" verify "CookieRejecter-$RELEASE_TAG.apk"

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" "CookieRejecter-$RELEASE_TAG.apk" \
            --verify-tag --prerelease --title "CookieRejecter $RELEASE_TAG" --generate-notes
